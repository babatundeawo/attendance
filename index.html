<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Attendance Register</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#16283F" />
    <style>
      :root {
        --paper: #f5f2ea;
        --line: #dad3bf;
        --ink: #1f3a5f;
        --ink-deep: #16283f;
        --text: #241f17;
        --soft: #6b6455;
        --present: #3f6c51;
        --present-bg: #e4eee4;
        --absent: #a63d40;
        --absent-bg: #f3e2e1;
        --card: #ffffff;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: #191712;
          --line: #322d22;
          --ink: #7fa0c9;
          --ink-deep: #9ebbdd;
          --text: #ece6d8;
          --soft: #a69c86;
          --present: #7fbe93;
          --present-bg: #1e2b21;
          --absent: #e28c8e;
          --absent-bg: #2e1c1c;
          --card: #221f18;
        }
      }
      :root[data-theme="dark"] {
        --paper: #191712;
        --line: #322d22;
        --ink: #7fa0c9;
        --ink-deep: #9ebbdd;
        --text: #ece6d8;
        --soft: #a69c86;
        --present: #7fbe93;
        --present-bg: #1e2b21;
        --absent: #e28c8e;
        --absent-bg: #2e1c1c;
        --card: #221f18;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--text);
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }
      h1,
      h2 {
        font-family: Georgia, "Times New Roman", serif;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 3px;
      }
      h2 {
        font-size: 0.9rem;
        margin: 14px 0 6px;
        color: var(--ink);
      }
      header {
        padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 8px;
        background: var(--ink-deep);
        color: #f5f2ea;
      }
      .sub {
        font-size: 0.75rem;
        color: #c7d3e2;
        margin: 0;
      }
      #syncStatus {
        font-size: 0.7rem;
        margin-top: 4px;
      }
      nav {
        display: flex;
        background: var(--ink-deep);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        flex-wrap: wrap;
      }
      nav button {
        flex: 1;
        min-width: 60px;
        background: none;
        border: none;
        color: #b9c6d8;
        padding: 9px 2px;
        font-size: 0.66rem;
        font-weight: 600;
        cursor: pointer;
      }
      nav button.active {
        color: #fff;
        border-bottom: 2px solid #fff;
      }
      main {
        flex: 1;
        padding: 12px 14px 24px;
        overflow-x: hidden;
      }
      .tab {
        display: none;
      }
      .tab.active {
        display: block;
      }
      .row-flex {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      button.chip {
        background: var(--card);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 7px 12px;
        border-radius: 8px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
      }
      button.chip.on {
        background: var(--ink-deep);
        color: #fff;
        border-color: var(--ink-deep);
      }
      select,
      input[type="date"],
      input[type="text"],
      input[type="tel"] {
        padding: 7px 8px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        font-size: 0.85rem;
        width: 100%;
      }
      .summary {
        display: flex;
        gap: 8px;
        margin: 8px 0;
      }
      .pill {
        flex: 1;
        text-align: center;
        padding: 7px 4px;
        border-radius: 9px;
        font-size: 0.68rem;
        font-weight: 600;
      }
      .pill .n {
        display: block;
        font-size: 1.05rem;
        font-family: Georgia, serif;
      }
      .pill.present {
        background: var(--present-bg);
        color: var(--present);
      }
      .reg-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 10px;
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--soft);
        text-transform: uppercase;
      }
      .reg-head .amL,
      .reg-head .pmL {
        width: 46px;
        text-align: center;
      }
      .stud-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
        margin: 4px 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .stud-row .num {
        font-size: 0.7rem;
        color: var(--soft);
        width: 18px;
        flex-shrink: 0;
      }
      .stud-row .name {
        flex: 1;
        font-size: 0.88rem;
        font-weight: 500;
      }
      .tick {
        width: 46px;
        display: flex;
        justify-content: center;
      }
      .tick input {
        width: 26px;
        height: 26px;
        accent-color: var(--present);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
        margin-bottom: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 5px;
        border-bottom: 1px solid var(--line);
      }
      th {
        color: var(--soft);
        font-weight: 600;
        font-size: 0.66rem;
        text-transform: uppercase;
      }
      tfoot td {
        font-weight: 700;
        border-top: 2px solid var(--ink);
      }
      .holiday-tag {
        background: var(--absent-bg);
        color: var(--absent);
        font-size: 0.66rem;
        padding: 2px 7px;
        border-radius: 6px;
      }
      .hol-item,
      .stu-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 9px 10px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 6px;
        font-size: 0.85rem;
      }
      .hol-item button,
      .stu-item button {
        background: var(--absent-bg);
        color: var(--absent);
        border: none;
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 0.72rem;
        font-weight: 700;
      }
      .note {
        font-size: 0.75rem;
        color: var(--soft);
        margin: 6px 0 14px;
      }
      .field {
        margin-bottom: 10px;
      }
      .field label {
        display: block;
        font-size: 0.72rem;
        color: var(--soft);
        margin-bottom: 3px;
        font-weight: 600;
      }
      .form-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 16px;
      }
      footer {
        padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        text-align: center;
        font-size: 0.64rem;
        color: var(--soft);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Attendance Register</h1>
      <p class="sub">Term: 14 Sep 2026 · 13 weeks</p>
      <p id="syncStatus" class="sub">Connecting…</p>
    </header>
    <nav>
      <button class="tabbtn active" data-tab="register">Register</button>
      <button class="tabbtn" data-tab="weekly">Weekly</button>
      <button class="tabbtn" data-tab="term">Term</button>
      <button class="tabbtn" data-tab="students">Students</button>
      <button class="tabbtn" data-tab="holidays">Holidays</button>
    </nav>
    <main>
      <section class="tab active" id="tab-register">
        <div class="row-flex">
          <button class="chip" id="prevDay">‹ Prev</button>
          <input type="date" id="datePicker" />
          <button class="chip" id="nextDay">Next ›</button>
        </div>
        <div id="holBadge"></div>
        <div class="summary">
          <div class="pill present">
            <span class="n" id="cntAM">0</span>AM present
          </div>
          <div class="pill present">
            <span class="n" id="cntPM">0</span>PM present
          </div>
        </div>
        <div class="row-flex">
          <button class="chip" id="markAllAM">Tick all AM</button>
          <button class="chip" id="markAllPM">Tick all PM</button>
          <button class="chip" id="clearDay">Clear day</button>
        </div>
        <div class="reg-head">
          <span style="width: 18px"></span><span style="flex: 1">Name</span
          ><span class="amL">AM</span><span class="pmL">PM</span>
        </div>
        <div id="studentList"></div>
      </section>
      <section class="tab" id="tab-weekly">
        <div class="row-flex">
          <label style="font-size: 0.85rem">Week: </label
          ><select id="weekSelect"></select>
        </div>
        <div id="weeklyOut"></div>
      </section>
      <section class="tab" id="tab-term"><div id="termOut"></div></section>
      <section class="tab" id="tab-students">
        <div class="form-card">
          <h2 style="margin-top: 0" id="formTitle">Add a student</h2>
          <input type="hidden" id="fId" />
          <div class="field">
            <label>Full name (Surname first)</label
            ><input
              type="text"
              id="fName"
              placeholder="e.g. ABRAHAM BLESSING"
            />
          </div>
          <div class="field">
            <label>Gender</label>
            <div class="row-flex">
              <button class="chip on" id="fGenM" type="button">Male</button
              ><button class="chip" id="fGenF" type="button">Female</button>
            </div>
          </div>
          <div class="field">
            <label>Admission number</label><input type="text" id="fAdm" />
          </div>
          <div class="field">
            <label>Date of birth</label><input type="date" id="fDob" />
          </div>
          <div class="field">
            <label>Parent/guardian name</label>
            <div class="row-flex">
              <input type="text" id="fParent" style="flex: 1" /><button
                class="chip"
                id="fAutoParent"
                type="button"
              >
                Auto-fill
              </button>
            </div>
          </div>
          <div class="field">
            <label>Address</label
            ><input
              type="text"
              id="fAddr"
              placeholder="e.g. Onidundun, Akinyele"
            />
          </div>
          <div class="field">
            <label>Parent phone number</label><input type="tel" id="fPhone" />
          </div>
          <div class="field">
            <label>Religion</label
            ><select id="fReligion">
              <option>Christianity</option>
              <option>Islam</option>
              <option>Traditional</option>
            </select>
          </div>
          <div class="row-flex">
            <button class="chip on" id="fSave">Save student</button
            ><button class="chip" id="fCancel">Cancel / New</button>
          </div>
        </div>
        <h2 style="margin-top: 0">Male students</h2>
        <div id="stuListM"></div>
        <h2>Female students</h2>
        <div id="stuListF"></div>
      </section>
      <section class="tab" id="tab-holidays">
        <div class="row-flex">
          <input type="date" id="holDate" /><input
            type="text"
            id="holLabel"
            placeholder="Reason (optional)"
            style="flex: 1"
          /><button class="chip on" id="addHoliday">Add</button>
        </div>
        <div id="holList"></div>
      </section>
    </main>
    <footer>
      Synced to your Firebase cloud database · works offline and syncs when back
      online
    </footer>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
      import {
        getFirestore,
        collection,
        doc,
        setDoc,
        deleteDoc,
        onSnapshot,
        deleteField,
        enableIndexedDbPersistence,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

      /* ====== PASTE YOUR FIREBASE CONFIG BELOW (Firebase console > Project settings > General > Your apps) ====== */
      const firebaseConfig = {
        apiKey: "AIzaSyDmuiZXf6xsCkp0B8TMGlrdCY6Gyhdb8YQ",
        authDomain: "class-attendance-c5494.firebaseapp.com",
        projectId: "class-attendance-c5494",
        storageBucket: "class-attendance-c5494.firebasestorage.app",
        messagingSenderId: "1050139925765",
        appId: "1:1050139925765:web:99612b6b0eb3a240bb2b6c",
      };
      /* ============================================================================================ */

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      enableIndexedDbPersistence(db).catch(function () {});
      var statusEl = document.getElementById("syncStatus");
      window.addEventListener("online", function () {
        statusEl.textContent = "Online · synced";
      });
      window.addEventListener("offline", function () {
        statusEl.textContent = "Offline · will sync later";
      });
      statusEl.textContent = navigator.onLine
        ? "Online · synced"
        : "Offline · will sync later";

      var students = [],
        attendance = {},
        holidays = {};
      var TERM_START = "2026-09-14",
        WEEKS = 13;

      function genId() {
        return (
          "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7)
        );
      }
      function titleCase(s) {
        return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
      }
      function autoParent(name) {
        var first = name.trim().split(/\s+/)[0] || "";
        return first ? "Mr & Mrs " + titleCase(first) : "";
      }
      function sortedStudents() {
        return students.slice().sort(function (a, b) {
          return a.name.localeCompare(b.name);
        });
      }
      function pad(n) {
        return String(n).padStart(2, "0");
      }
      function dstr(d) {
        return (
          d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
        );
      }
      function parseD(s) {
        return new Date(s + "T00:00:00");
      }
      function addDays(d, n) {
        var r = new Date(d);
        r.setDate(r.getDate() + n);
        return r;
      }
      function todayStr() {
        return dstr(new Date());
      }
      function isWeekend(d) {
        var w = d.getDay();
        return w === 0 || w === 6;
      }
      function weekDates(w) {
        var start = addDays(parseD(TERM_START), (w - 1) * 7);
        var out = [];
        for (var i = 0; i < 5; i++) {
          out.push(dstr(addDays(start, i)));
        }
        return out;
      }
      function isSchoolDay(ds) {
        var d = parseD(ds);
        if (isWeekend(d)) return false;
        if (holidays[ds]) return false;
        if (ds > todayStr()) return false;
        return true;
      }
      function getStatus(ds, id, sess) {
        return !!(
          attendance[ds] &&
          attendance[ds][id] &&
          attendance[ds][id][sess]
        );
      }
      function setStatus(ds, id, sess, val) {
        var data = {};
        data[id] = {};
        data[id][sess] = val ? true : deleteField();
        setDoc(doc(db, "attendance", ds), data, { merge: true });
      }
      function dayPoints(ds, id) {
        return (
          (getStatus(ds, id, "morning") ? 1 : 0) +
          (getStatus(ds, id, "afternoon") ? 1 : 0)
        );
      }
      function sessionTally(ds, sess) {
        var c = 0;
        students.forEach(function (st) {
          if (getStatus(ds, st.id, sess)) c++;
        });
        return c;
      }

      /* live sync */
      onSnapshot(collection(db, "students"), function (snap) {
        students = snap.docs.map(function (d) {
          return Object.assign({ id: d.id }, d.data());
        });
        if (students.length === 0) seedStudents();
        renderActiveTab();
      });
      onSnapshot(collection(db, "attendance"), function (snap) {
        attendance = {};
        snap.docs.forEach(function (d) {
          attendance[d.id] = d.data();
        });
        renderActiveTab();
      });
      onSnapshot(collection(db, "holidays"), function (snap) {
        holidays = {};
        snap.docs.forEach(function (d) {
          holidays[d.id] = d.data();
        });
        renderActiveTab();
      });
      function seedStudents() {
        var M = [
          "ABUBAKAR HARUNA",
          "ABUBAKAR LAWAZANA",
          "AJOBO ADAMS",
          "ARINOYE PETER",
          "AYOMIKUN MICHAEL",
          "DAVID ANDREW",
          "DOMINIC SUNDAY",
          "IBRAHIM ROSHEED",
          "IBRAHIM SAMAD",
          "ISMAIL SAMAD",
          "JAMES DAVID",
          "JOHN JOSEPH",
          "MURITALA ABDULRASHEED",
          "OLANIYAN JULIUS",
          "OLANIYI SAMAD",
          "OLAYODE ABDULSAMAD",
          "OLUKUNMI DANIEL",
          "OMOWUNMI FRIDAUS",
          "OYEDOKUN KHOLEED",
          "PETER SUNDAY",
          "RASAQ RIDWAN",
          "SAMUEL KEHINDE",
          "SARUMI ABDULQUDUS",
        ];
        var F = [
          "ABRAHAM BLESSING",
          "AJANI ADENIKE",
          "AJAYI DORCAS",
          "AKOREDE SOFIAT",
          "ATOBATELE DEBORAH",
          "BADMUS ALLIAT",
          "DADA HERITAGE",
          "DARAMOLA AISHAT",
          "GBADEBO REBECCA",
          "HAMZAT AYOKA",
          "IDRIS ROKEEBAT",
          "ISAAC ROSELINE",
          "MUHAMMED MARIAM",
          "MUHAMMED SADIA",
          "MUSTAPHA ROHEEMAT",
          "OGUNDAIRO DEBORAH",
          "OLADELE RODIAT",
          "OLALEKAN ALIYAT",
          "OLANIYAN RODIAT",
          "RASAQ RUKAYAT",
          "SANNI AISHAT",
          "SHUAIB MARIAM",
          "USMAN ABIBAT",
          "YUSUF AYISAT",
          "SAMUEL TAIWO",
          "WAHAB YUSROH",
          "ADEJUMO VICTORIA",
        ];
        M.forEach(function (n) {
          setDoc(doc(db, "students", genId()), {
            name: n,
            gender: "M",
            admissionNo: "",
            dob: "",
            parentName: autoParent(n),
            address: "",
            phone: "",
            religion: "Christianity",
          });
        });
        F.forEach(function (n) {
          setDoc(doc(db, "students", genId()), {
            name: n,
            gender: "F",
            admissionNo: "",
            dob: "",
            parentName: autoParent(n),
            address: "",
            phone: "",
            religion: "Christianity",
          });
        });
      }

      /* Register */
      var datePicker = document.getElementById("datePicker");
      datePicker.value = todayStr();
      function renderRegister() {
        var ds = datePicker.value,
          d = parseD(ds);
        var holBadge = document.getElementById("holBadge"),
          listEl = document.getElementById("studentList");
        if (isWeekend(d)) {
          holBadge.innerHTML =
            '<span class="holiday-tag">Weekend — no marking</span>';
          listEl.innerHTML = "";
          updateCounts(0, 0);
          return;
        }
        holBadge.innerHTML = holidays[ds]
          ? '<span class="holiday-tag">Holiday: ' +
            (holidays[ds].label || "declared holiday") +
            "</span>"
          : "";
        listEl.innerHTML = "";
        [
          ["M", "Males"],
          ["F", "Females"],
        ].forEach(function (pair) {
          var h = document.createElement("h2");
          h.textContent = pair[1];
          listEl.appendChild(h);
          var n = 1;
          sortedStudents()
            .filter(function (s) {
              return s.gender === pair[0];
            })
            .forEach(function (st) {
              var row = document.createElement("div");
              row.className = "stud-row";
              var num = document.createElement("span");
              num.className = "num";
              num.textContent = n++ + ".";
              var nm = document.createElement("span");
              nm.className = "name";
              nm.textContent = st.name;
              var amWrap = document.createElement("span");
              amWrap.className = "tick";
              var am = document.createElement("input");
              am.type = "checkbox";
              am.checked = getStatus(ds, st.id, "morning");
              am.addEventListener("change", function () {
                setStatus(ds, st.id, "morning", am.checked);
                updateCounts();
              });
              amWrap.appendChild(am);
              var pmWrap = document.createElement("span");
              pmWrap.className = "tick";
              var pm = document.createElement("input");
              pm.type = "checkbox";
              pm.checked = getStatus(ds, st.id, "afternoon");
              pm.addEventListener("change", function () {
                setStatus(ds, st.id, "afternoon", pm.checked);
                updateCounts();
              });
              pmWrap.appendChild(pm);
              row.appendChild(num);
              row.appendChild(nm);
              row.appendChild(amWrap);
              row.appendChild(pmWrap);
              listEl.appendChild(row);
            });
        });
        updateCounts();
      }
      function updateCounts() {
        var ds = datePicker.value;
        document.getElementById("cntAM").textContent = sessionTally(
          ds,
          "morning",
        );
        document.getElementById("cntPM").textContent = sessionTally(
          ds,
          "afternoon",
        );
      }
      document.getElementById("prevDay").addEventListener("click", function () {
        datePicker.value = dstr(addDays(parseD(datePicker.value), -1));
        renderRegister();
      });
      document.getElementById("nextDay").addEventListener("click", function () {
        datePicker.value = dstr(addDays(parseD(datePicker.value), 1));
        renderRegister();
      });
      datePicker.addEventListener("change", renderRegister);
      document
        .getElementById("markAllAM")
        .addEventListener("click", function () {
          var ds = datePicker.value;
          students.forEach(function (st) {
            setStatus(ds, st.id, "morning", true);
          });
          renderRegister();
        });
      document
        .getElementById("markAllPM")
        .addEventListener("click", function () {
          var ds = datePicker.value;
          students.forEach(function (st) {
            setStatus(ds, st.id, "afternoon", true);
          });
          renderRegister();
        });
      var clearArmed = false,
        clearTimer = null,
        clearBtn = document.getElementById("clearDay");
      clearBtn.addEventListener("click", function () {
        if (!clearArmed) {
          clearArmed = true;
          clearBtn.textContent = "Tap again to confirm";
          clearTimer = setTimeout(function () {
            clearArmed = false;
            clearBtn.textContent = "Clear day";
          }, 3000);
          return;
        }
        clearTimeout(clearTimer);
        clearArmed = false;
        clearBtn.textContent = "Clear day";
        var ds = datePicker.value;
        students.forEach(function (st) {
          setStatus(ds, st.id, "morning", false);
          setStatus(ds, st.id, "afternoon", false);
        });
        renderRegister();
      });

      /* Weekly */
      var weekSelect = document.getElementById("weekSelect");
      for (var w = 1; w <= WEEKS; w++) {
        var opt = document.createElement("option");
        opt.value = w;
        var wd = weekDates(w);
        opt.textContent =
          "Week " + w + " (" + wd[0].slice(5) + " – " + wd[4].slice(5) + ")";
        weekSelect.appendChild(opt);
      }
      function currentWeekIndex() {
        var t = todayStr();
        for (var w = 1; w <= WEEKS; w++) {
          if (t <= weekDates(w)[4]) return w;
        }
        return WEEKS;
      }
      weekSelect.value = currentWeekIndex();
      weekSelect.addEventListener("change", renderWeekly);
      function renderWeekly() {
        var w = parseInt(weekSelect.value, 10),
          dates = weekDates(w),
          out = document.getElementById("weeklyOut");
        var html =
          "<table><thead><tr><th>Day</th><th>AM</th><th>PM</th><th>Total</th></tr></thead><tbody>";
        var wkM = 0,
          wkA = 0,
          schoolDays = 0;
        dates.forEach(function (ds) {
          var d = parseD(ds),
            label = d.toLocaleDateString(undefined, {
              weekday: "short",
              month: "short",
              day: "numeric",
            });
          if (holidays[ds]) {
            html +=
              "<tr><td>" +
              label +
              "</td><td colspan='3'><span class='holiday-tag'>Holiday" +
              (holidays[ds].label ? ": " + holidays[ds].label : "") +
              "</span></td></tr>";
            return;
          }
          if (ds > todayStr()) {
            html +=
              "<tr><td>" +
              label +
              "</td><td colspan='3' style='color:var(--soft)'>Not yet occurred</td></tr>";
            return;
          }
          var m = sessionTally(ds, "morning"),
            a = sessionTally(ds, "afternoon");
          wkM += m;
          wkA += a;
          schoolDays++;
          html +=
            "<tr><td>" +
            label +
            "</td><td>" +
            m +
            "</td><td>" +
            a +
            "</td><td>" +
            (m + a) +
            "</td></tr>";
        });
        var expected = schoolDays * students.length * 2,
          actual = wkM + wkA,
          pct = expected > 0 ? ((actual / expected) * 100).toFixed(1) : "0.0";
        html +=
          "</tbody><tfoot><tr><td>Week total</td><td>" +
          wkM +
          "</td><td>" +
          wkA +
          "</td><td>" +
          actual +
          "</td></tr></tfoot></table>";
        html +=
          "<p class='note'>School days so far: " +
          schoolDays +
          ". Expected: " +
          expected +
          ".<br><b style='color:var(--text)'>Week " +
          w +
          ": " +
          actual +
          " / " +
          expected +
          " = " +
          pct +
          "%</b></p>";
        html +=
          "<h2>Per-student — Week " +
          w +
          "</h2><table><thead><tr><th>#</th><th>Name</th><th>Points</th></tr></thead><tbody>";
        var maxPts = schoolDays * 2;
        sortedStudents().forEach(function (st, i) {
          var pts = 0;
          dates.forEach(function (ds) {
            if (isSchoolDay(ds)) pts += dayPoints(ds, st.id);
          });
          html +=
            "<tr><td>" +
            (i + 1) +
            "</td><td>" +
            st.name +
            "</td><td>" +
            pts +
            " / " +
            maxPts +
            "</td></tr>";
        });
        html += "</tbody></table>";
        out.innerHTML = html;
      }

      /* Term */
      function renderTerm() {
        var out = document.getElementById("termOut"),
          allSchoolDays = [];
        for (var w = 1; w <= WEEKS; w++) {
          weekDates(w).forEach(function (ds) {
            if (isSchoolDay(ds)) allSchoolDays.push(ds);
          });
        }
        var maxPts = allSchoolDays.length * 2,
          grandActual = 0;
        var html =
          "<p class='note'>School days so far: " +
          allSchoolDays.length +
          " (weekends/holidays excluded, future dates not counted).</p>";
        html +=
          "<table><thead><tr><th>#</th><th>Name</th><th>Total</th><th>%</th></tr></thead><tbody>";
        sortedStudents().forEach(function (st, i) {
          var pts = 0;
          allSchoolDays.forEach(function (ds) {
            pts += dayPoints(ds, st.id);
          });
          grandActual += pts;
          var pct = maxPts > 0 ? ((pts / maxPts) * 100).toFixed(1) : "0.0";
          html +=
            "<tr><td>" +
            (i + 1) +
            "</td><td>" +
            st.name +
            "</td><td>" +
            pts +
            " / " +
            maxPts +
            "</td><td>" +
            pct +
            "%</td></tr>";
        });
        var grandExpected = maxPts * students.length,
          grandPct =
            grandExpected > 0
              ? ((grandActual / grandExpected) * 100).toFixed(1)
              : "0.0";
        html +=
          "</tbody><tfoot><tr><td colspan='2'>Grand total</td><td>" +
          grandActual +
          " / " +
          grandExpected +
          "</td><td>" +
          grandPct +
          "%</td></tr></tfoot></table>";
        out.innerHTML = html;
      }

      /* Students */
      var fGender = "M";
      document.getElementById("fGenM").addEventListener("click", function () {
        fGender = "M";
        this.classList.add("on");
        document.getElementById("fGenF").classList.remove("on");
      });
      document.getElementById("fGenF").addEventListener("click", function () {
        fGender = "F";
        this.classList.add("on");
        document.getElementById("fGenM").classList.remove("on");
      });
      document
        .getElementById("fAutoParent")
        .addEventListener("click", function () {
          document.getElementById("fParent").value = autoParent(
            document.getElementById("fName").value,
          );
        });
      function clearForm() {
        document.getElementById("fId").value = "";
        document.getElementById("fName").value = "";
        document.getElementById("fAdm").value = "";
        document.getElementById("fDob").value = "";
        document.getElementById("fParent").value = "";
        document.getElementById("fAddr").value = "";
        document.getElementById("fPhone").value = "";
        document.getElementById("fReligion").value = "Christianity";
        fGender = "M";
        document.getElementById("fGenM").classList.add("on");
        document.getElementById("fGenF").classList.remove("on");
        document.getElementById("formTitle").textContent = "Add a student";
      }
      function loadForm(st) {
        document.getElementById("fId").value = st.id;
        document.getElementById("fName").value = st.name;
        document.getElementById("fAdm").value = st.admissionNo || "";
        document.getElementById("fDob").value = st.dob || "";
        document.getElementById("fParent").value = st.parentName || "";
        document.getElementById("fAddr").value = st.address || "";
        document.getElementById("fPhone").value = st.phone || "";
        document.getElementById("fReligion").value =
          st.religion || "Christianity";
        fGender = st.gender;
        document
          .getElementById("fGenM")
          .classList.toggle("on", fGender === "M");
        document
          .getElementById("fGenF")
          .classList.toggle("on", fGender === "F");
        document.getElementById("formTitle").textContent = "Edit student";
      }
      document.getElementById("fCancel").addEventListener("click", clearForm);
      document.getElementById("fSave").addEventListener("click", function () {
        var name = document.getElementById("fName").value.trim();
        if (!name) {
          alert("Enter the student's name.");
          return;
        }
        var id = document.getElementById("fId").value || genId();
        var rec = {
          name: name,
          gender: fGender,
          admissionNo: document.getElementById("fAdm").value.trim(),
          dob: document.getElementById("fDob").value,
          parentName:
            document.getElementById("fParent").value.trim() || autoParent(name),
          address: document.getElementById("fAddr").value.trim(),
          phone: document.getElementById("fPhone").value.trim(),
          religion: document.getElementById("fReligion").value,
        };
        setDoc(doc(db, "students", id), rec);
        clearForm();
      });
      var delArmed = {};
      function renderStudents() {
        ["M", "F"].forEach(function (g) {
          var el = document.getElementById(g === "M" ? "stuListM" : "stuListF");
          el.innerHTML = "";
          sortedStudents()
            .filter(function (s) {
              return s.gender === g;
            })
            .forEach(function (st) {
              var item = document.createElement("div");
              item.className = "stu-item";
              var left = document.createElement("span");
              left.textContent =
                st.name + (st.admissionNo ? " · " + st.admissionNo : "");
              left.style.flex = "1";
              left.style.cursor = "pointer";
              left.addEventListener("click", function () {
                loadForm(st);
                window.scrollTo({ top: 0, behavior: "smooth" });
              });
              var btn = document.createElement("button");
              btn.textContent = "Remove";
              btn.addEventListener("click", function () {
                if (!delArmed[st.id]) {
                  delArmed[st.id] = true;
                  btn.textContent = "Confirm?";
                  setTimeout(function () {
                    delArmed[st.id] = false;
                    btn.textContent = "Remove";
                  }, 3000);
                  return;
                }
                deleteDoc(doc(db, "students", st.id));
              });
              item.appendChild(left);
              item.appendChild(btn);
              el.appendChild(item);
            });
        });
      }

      /* Holidays */
      function renderHolidays() {
        var out = document.getElementById("holList"),
          keys = Object.keys(holidays).sort();
        if (keys.length === 0) {
          out.innerHTML = "<p class='note'>No holidays declared yet.</p>";
          return;
        }
        out.innerHTML = "";
        keys.forEach(function (ds) {
          var item = document.createElement("div");
          item.className = "hol-item";
          var d = parseD(ds),
            lbl = d.toLocaleDateString(undefined, {
              weekday: "short",
              year: "numeric",
              month: "short",
              day: "numeric",
            });
          item.innerHTML =
            "<span>" +
            lbl +
            (holidays[ds].label ? " — " + holidays[ds].label : "") +
            "</span>";
          var btn = document.createElement("button");
          btn.textContent = "Remove";
          btn.addEventListener("click", function () {
            deleteDoc(doc(db, "holidays", ds));
          });
          item.appendChild(btn);
          out.appendChild(item);
        });
      }
      document
        .getElementById("addHoliday")
        .addEventListener("click", function () {
          var ds = document.getElementById("holDate").value;
          if (!ds) return;
          var label = document.getElementById("holLabel").value.trim();
          setDoc(doc(db, "holidays", ds), { label: label });
          document.getElementById("holLabel").value = "";
        });

      /* Tabs */
      var activeTab = "register";
      document.querySelectorAll(".tabbtn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".tabbtn").forEach(function (b) {
            b.classList.remove("active");
          });
          document.querySelectorAll(".tab").forEach(function (t) {
            t.classList.remove("active");
          });
          btn.classList.add("active");
          document
            .getElementById("tab-" + btn.dataset.tab)
            .classList.add("active");
          activeTab = btn.dataset.tab;
          renderActiveTab();
        });
      });
      function renderActiveTab() {
        if (activeTab === "register") renderRegister();
        else if (activeTab === "weekly") renderWeekly();
        else if (activeTab === "term") renderTerm();
        else if (activeTab === "students") renderStudents();
        else if (activeTab === "holidays") renderHolidays();
      }

      if (
        "serviceWorker" in navigator &&
        location.protocol.indexOf("http") === 0
      ) {
        navigator.serviceWorker
          .register("service-worker.js")
          .catch(function () {});
      }
      clearForm();
    </script>
  </body>
</html>
